name: Build Nova Hospital APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make app icons from logo
        run: bash scripts/make_icons.sh

      - name: Make sure Android SDK parts are present
        continue-on-error: true
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NovaHospitalLtd.apk

      - name: Save APK as download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NovaHospitalLtd-apk
          path: NovaHospitalLtd.apk

      - name: Publish APK in Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Nova Hospital Ltd APK (build ${{ github.run_number }})
          files: NovaHospitalLtd.apk
